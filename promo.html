<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F7F7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<meta name="description" content="把 PDF 或 TXT 放进来，去掉页眉、页脚和页码，只留下可以长时间读的正文。">
<title>纯净阅读</title>
<style>
  :root {
    --bg: #F7F7F5;
    --fg: #1D1D1F;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151515;
      --fg: #E8E8E6;
      color-scheme: dark;
    }
    ::selection { background: rgba(232, 232, 230, 0.18); }
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; background: var(--bg); color: var(--fg); }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 14vh 28px 12vh;
    font-family: "Songti SC", "Noto Serif SC", STSong, "Source Han Serif SC", "Noto Serif CJK SC", PMingLiU, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "New York", "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  main { width: min(640px, 100%); }

  .eyebrow {
    margin: 0 0 1.5em;
    font-size: 13px;
    letter-spacing: 0.28em;
    opacity: 0.42;
  }

  h1 {
    margin: 0 0 1.15em;
    font-size: 46px;
    font-weight: 400;
    line-height: 1.35;
    letter-spacing: 0.12em;
  }

  p {
    margin: 0 0 1.15em;
    font-size: 20px;
    line-height: 1.95;
    letter-spacing: 0.02em;
  }

  .enter {
    display: inline-block;
    margin-top: 0.8em;
    color: inherit;
    font-size: 18px;
    letter-spacing: 0.22em;
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--fg) 40%, transparent);
    padding-bottom: 0.18em;
  }
  .enter:hover, .enter:focus-visible { opacity: 0.62; }

  .author {
    margin: 4.8em 0 0;
    font-size: 13px;
    letter-spacing: 0.18em;
    opacity: 0.4;
  }

  #lang {
    position: fixed;
    top: 18px;
    right: 24px;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Segoe UI", sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    opacity: 0.55;
  }
  #lang span[data-lang] { opacity: 0.38; }
  #lang span[data-lang].is-active { opacity: 1; }
  #lang:hover, #lang:focus-visible { opacity: 0.9; }

  :focus-visible { outline: 1px solid color-mix(in srgb, var(--fg) 35%, transparent); outline-offset: 3px; }
  ::selection { background: rgba(29, 29, 31, 0.12); }

  @media (max-width: 720px) {
    body { padding: 12vh 22px 10vh; }
    h1 { font-size: 34px; letter-spacing: 0.08em; }
    p { font-size: 18px; }
    #lang { right: 16px; top: 14px; }
  }
</style>
</head>
<body>
  <button type="button" id="lang" aria-label="语言">
    <span data-lang="zh">中</span><span> / </span><span data-lang="en">EN</span>
  </button>
  <main>
    <p class="eyebrow" data-i18n="eyebrow">纯净阅读</p>
    <h1 data-i18n="title">只留下正文</h1>
    <p data-i18n="lead">把 PDF 或 TXT 放进来。页眉、页脚和单独一行的页码会被拿掉，剩下可以长时间读的文字。</p>
    <p data-i18n="focus">文字自己缓慢上移。眼睛停在屏幕中央，靠近上下边缘的句子慢慢变淡。</p>
    <p data-i18n="local">速度、字号、字体和宽度都可以改。最近读过的，还在这台浏览器里。文字不会上传。</p>
    <a class="enter" href="index.html" data-i18n="enter">开始阅读</a>
    <p class="author" data-i18n="author">作者　粮宇</p>
  </main>
<script>
(function () {
  var COPY = {
    zh: {
      title: "纯净阅读",
      eyebrow: "纯净阅读",
      headline: "只留下正文",
      lead: "把 PDF 或 TXT 放进来。页眉、页脚和单独一行的页码会被拿掉，剩下可以长时间读的文字。",
      focus: "文字自己缓慢上移。眼睛停在屏幕中央，靠近上下边缘的句子慢慢变淡。",
      local: "速度、字号、字体和宽度都可以改。最近读过的，还在这台浏览器里。文字不会上传。",
      enter: "开始阅读",
      author: "作者　粮宇",
      lang: "语言"
    },
    en: {
      title: "Pure Reader",
      eyebrow: "Pure Reader",
      headline: "Only the text",
      lead: "Bring in a PDF or TXT. Headers, footers, and page numbers on a line of their own are taken away.",
      focus: "The words drift slowly upward. Your eyes stay at the center, and lines near the edges fade.",
      local: "Speed, size, typeface, and width can be changed. Recent texts stay in this browser. Nothing is uploaded.",
      enter: "Start reading",
      author: "Author　粮宇",
      lang: "Language"
    }
  };
  var KEY = "purereader.v1";
  var lang = "zh";

  function readStore() {
    try { return JSON.parse(localStorage.getItem(KEY) || "null") || {}; }
    catch (err) { return {}; }
  }

  function apply(next) {
    lang = next === "en" ? "en" : "zh";
    var pack = COPY[lang];
    document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
    document.title = pack.title;
    document.querySelector("[data-i18n='eyebrow']").textContent = pack.eyebrow;
    document.querySelector("[data-i18n='title']").textContent = pack.headline;
    document.querySelector("[data-i18n='lead']").textContent = pack.lead;
    document.querySelector("[data-i18n='focus']").textContent = pack.focus;
    document.querySelector("[data-i18n='local']").textContent = pack.local;
    document.querySelector("[data-i18n='enter']").textContent = pack.enter;
    document.querySelector("[data-i18n='author']").textContent = pack.author;
    document.getElementById("lang").setAttribute("aria-label", pack.lang);
    document.querySelectorAll("#lang [data-lang]").forEach(function (el) {
      el.classList.toggle("is-active", el.getAttribute("data-lang") === lang);
    });
    var meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute("content", pack.lead);
  }

  var stored = readStore();
  apply(stored.lang === "en" ? "en" : "zh");
  document.getElementById("lang").addEventListener("click", function () {
    var next = lang === "en" ? "zh" : "en";
    var raw = readStore();
    raw.lang = next;
    try { localStorage.setItem(KEY, JSON.stringify(raw)); } catch (err) {}
    apply(next);
  });
})();
</script>
</body>
</html>
